<!DOCTYPE html>
<html>

<head>
  <meta name="description" content="Vedio Studio — 浏览器端视频工作台：场景编排 + 时间轴编辑 + 舞台预览 + 浏览器导出 MP4 + AI 助手" />
  <title>Vedio Studio</title>
</head>
<style>
  body {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    background: #0a0e16;
  }

  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--spacing-md);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(15, 20, 32, 0.95);
    position: relative;
    z-index: 20;
  }

  .brand {
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-bold);
    color: #4361ee;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, #4361ee, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px;
  }

  .doc-title {
    font-size: var(--font-size-md);
    color: var(--text-color);
    max-width: 240px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-left: var(--spacing-sm);
    cursor: pointer;
  }
  .doc-title.empty { color: var(--text-color-disabled); cursor: default; }
  .doc-title:hover { color: #c7d2fe; }
  .save-state { font-size: 11px; color: #64748b; white-space: nowrap; }
  .save-state.dirty { color: #fbbf24; }
  .save-state.fail { color: #f87171; }

  .spacer { flex: 1; }

  .tbtn {
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: #cbd5e1;
    padding: 6px 14px;
    border-radius: 9px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tbtn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  .tbtn.primary {
    background: linear-gradient(135deg, #4361ee, #5b46f0);
    border: none; color: #fff; font-weight: 600;
  }
  .tbtn.primary:hover { filter: brightness(1.12); }
  .tbtn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .tbtn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---- 工作区三栏 ---- */
  .ws { flex: 1; min-height: 0; display: flex; }
  .left { flex: none; width: 196px; border-right: 1px solid rgba(255, 255, 255, 0.08); display: flex; min-height: 0; }
  .left video-scenes { flex: 1; min-height: 0; display: flex; }
  .center { flex: 1; min-width: 0; min-height: 0; display: flex; }
  .center video-stage { flex: 1; min-height: 0; display: flex; }
  .right {
    flex: none; width: 322px; border-left: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(13, 17, 28, 0.9); display: flex; flex-direction: column; min-height: 0;
  }
  .rtabs { flex: none; display: flex; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  .rtabs button {
    flex: 1; border: none; background: transparent; color: #64748b;
    font-size: 13px; padding: 9px 0; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .rtabs button.on { color: #e0e7ff; border-bottom-color: #4361ee; background: rgba(67, 97, 238, 0.08); }
  .rbody { flex: 1; min-height: 0; display: flex; }
  .rbody video-inspector { flex: 1; min-height: 0; display: flex; }
  .rbody ai-box { flex: 1; min-height: 0; display: flex; }

  .bottom { flex: none; height: 188px; display: flex; }
  .bottom video-timeline { flex: 1; min-width: 0; min-height: 0; display: flex; }

  .popover {
    position: absolute;
    top: 48px;
    right: 8px;
    width: 300px;
    max-height: 60vh;
    overflow: auto;
    background: #121826;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    z-index: 40;
    padding: 8px;
  }
  .pop-item {
    display: flex; flex-direction: column; gap: 2px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: #cbd5e1;
    position: relative;
  }
  .pop-item:hover { background: rgba(67, 97, 238, 0.16); }
  .pop-item .t { font-size: 13.5px; font-weight: 600; color: #e2e8f0; }
  .pop-item .d { font-size: 11.5px; color: #64748b; }
  .pop-item .del {
    position: absolute; right: 8px; top: 9px; color: #94a3b8; font-size: 12px; padding: 2px 6px; border-radius: 6px;
  }
  .pop-item .del:hover { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  .pop-title { padding: 6px 8px 4px; font-size: 11px; color: #64748b; letter-spacing: 0.5px; }

  .toast {
    position: fixed;
    top: 56px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #e2e8f0;
    padding: 8px 18px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 100;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
</style>

<body>
  <div class="topbar">
    <div class="brand"><span class="logo">▶</span> Vedio Studio</div>
    <div class="doc-title" :class="{ empty: !curName && !curTitle }" @click="selNone()" title="点击查看项目设置">{{ curTitle || curName || '未打开项目' }}</div>
    <span class="save-state" :class="{ dirty: saveState === '未保存', fail: saveState === '保存失败' }">{{ saveState }}</span>
    <div class="spacer"></div>
    <button class="tbtn" @click="showCases = !showCases; showProjects = false">样例</button>
    <button class="tbtn" @click="showProjects = !showProjects; showCases = false; refreshProjects()">项目</button>
    <button class="tbtn" @click="newProject()">新建</button>
    <button class="tbtn" @click="undoEdit()" :disabled="!undoStack.length" title="撤销（Cmd/Ctrl+Z）">撤销</button>
    <button class="tbtn" @click="redoEdit()" :disabled="!redoStack.length" title="重做（Cmd/Ctrl+Shift+Z）">重做</button>
    <button class="tbtn primary" @click="exportMp4()" :disabled="exporting || !doc">导出 MP4</button>
  </div>

  <div class="popover" v-if="showCases">
    <div class="pop-title">内置样例（只读，点击加载）</div>
    <div v-for="c in cases" :key="c.id" class="pop-item" @click="openCase(c.id)">
      <div class="t">{{ c.title }}</div>
      <div class="d">{{ c.desc }}</div>
    </div>
  </div>

  <div class="popover" v-if="showProjects">
    <div class="pop-title">我的项目（云端会话存储）</div>
    <div v-if="!projects.length" class="pop-item"><div class="d">暂无项目，点击「新建」开始创作</div></div>
    <div v-for="p in projects" :key="p.name" class="pop-item" @click="openProject(p.name)">
      <div class="t">{{ p.title }} <span style="color:#64748b;font-weight:400">· {{ p.duration }}s · {{ p.scenes }} 场景</span></div>
      <div class="d">{{ p.name }}</div>
      <span class="del" @click.stop="deleteProject(p.name)">删除</span>
    </div>
  </div>

  <div class="ws">
    <div class="left">
      <video-scenes :scenes="doc ? doc.scenes : []" :cur="activeSceneIdx()" :readonly="!curName" :ver="sceneVer"
        @pick="onPickScene" @add="addScene" @dup="dupScene" @del="delScene" @move="moveScene"></video-scenes>
    </div>
    <div class="center">
      <video-stage ref="stage" :editable="!!curName && !exporting" :selid="sel.kind === 'element' ? sel.elId : ''"
        @select="onStageSelect" @mutate="onStageChange" @ctxdel="delElements"></video-stage>
    </div>
    <div class="right">
      <div class="rtabs">
        <button :class="{ on: rtab === 'props' }" @click="rtab = 'props'">属性</button>
        <button :class="{ on: rtab === 'ai' }" @click="rtab = 'ai'">AI 助手</button>
      </div>
      <div class="rbody">
        <video-inspector v-show="rtab === 'props'" :doc="doc" :sel="sel" :frame="curFrame" :readonly="!curName"
          :uploadasset="uploadAsset"
          @mutate="onDocChange" @saveas="saveAsProject" @pickel="onPickEl"
          @delel="delElement" @dupel="dupElement"></video-inspector>
        <ai-box v-show="rtab === 'ai'" v:id="sid"></ai-box>
      </div>
    </div>
  </div>

  <div class="bottom">
    <video-timeline :doc="doc" :frame="curFrame" :sel="sel" :readonly="!curName" :ver="sceneVer"
      @seek="onSeek" @pickscene="onPickScene" @pickel="onPickEl" @addel="onAddEl"
      @docchange="onDocChange" @movescene="moveSceneTo"></video-timeline>
  </div>

  <div class="toast" v-if="toast">{{ toast }}</div>
</body>

<script setup>
  import { starterDoc, defaultTheme, uid } from './video/engine.js'

  // ---- 状态 ----
  sid = $router.current.query.session_id || ''
  doc = null            // 当前 video/1 文档对象（真身，proxy）
  curName = ''          // 当前项目名（'' = 样例只读）
  curTitle = ''
  assets = {}           // ref → dataURL（预览/导出共用）
  sel = { kind: 'none', sceneIndex: 0, elId: '' }   // 选中态
  rtab = 'props'        // 右栏 tab
  curFrame = 0          // 当前帧（rAF 同步自 stage）
  cases = []
  projects = []
  showCases = false
  showProjects = false
  exporting = false
  toast = ''
  saveState = ''
  sceneVer = 0        // 场景结构版本号（增删/移动后递增，强制子组件重建列表）

  // ---- page_exec（AI 指令通道；存储走 $cloud_fs 不依赖它）----
  pe = null

  let toastTimer = 0
  let saveTimer = 0

  const projRoot = () => '/sessions/' + sid + '/vedio'
  const projDir = (name) => projRoot() + '/' + name
  const projIndex = (name) => projDir(name) + '/index.json'
  const normName = (n) => String(n || '').trim().replace(/[\\/:\*\?"<>\|#%\s]+/g, '-').replace(/^-+|-+$/g, '') || 'video-' + Date.now().toString(36)
  const normRel = (p) => {
    p = String(p || '').trim().replace(/^\/+/, '')
    if (!p || p.indexOf('..') >= 0) throw new Error('非法路径: ' + p)
    return p
  }
  const showToast = (msg) => {
    toast = msg
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { toast = '' }, 2600)
  }
  const ensureTheme = (d) => {
    d.theme = Object.assign(defaultTheme(), d.theme || {})
    d.theme.captionStyle = Object.assign(defaultTheme().captionStyle, d.theme.captionStyle || {})
    return d
  }

  // ---- 云存储（$mod.$cloud_fs → 服务端 UFS /sessions/{sid}/vedio/）----
  storageReady = () => !!(sid && $mod.$cloud_fs)
  const fsText = async (path) => {
    const r = await $mod.$cloud_fs.get(path)
    return typeof r.content === 'string' ? r.content : await r.content.text()
  }
  const fsGet = (path) => $mod.$cloud_fs.get(path)         // {ok, content(string|Blob), mime, size}
  const fsPut = (path, content) => $mod.$cloud_fs.put(path, content)   // string | Blob
  const fsLs = async (path) => {
    try { return await $mod.$cloud_fs.ls(path) } catch (e) { return { ok: false, items: [] } }
  }
  const fsRm = (path) => $mod.$cloud_fs.rm(path)
  // 目录删除：先试整删，失败则递归逐文件
  const rmDir = async (dir) => {
    try { await fsRm(dir); return } catch (e) { }
    const walk = async (d) => {
      const l = await fsLs(d + '/')
      for (const it of (l.items || [])) {
        if (it.dir) await walk(d + '/' + it.name)
        else { try { await fsRm(d + '/' + it.name) } catch (e) { } }
      }
      try { await fsRm(d) } catch (e) { }
    }
    await walk(dir)
  }

  // ---- 初始化 ----
  initPage = async () => {
    await loadCases()
    await ensureSession()
  }

  // 会话自举：URL 带 sid 直接用；否则复用 localStorage 的工作台会话；再否则新建（隐藏会话）
  ensureSession = async () => {
    if (!sid) {
      const saved = localStorage.getItem('vedio_studio_sid') || ''
      if (saved) {
        try {
          const r = await fetch('/api/sessions/' + saved)
          if (r.ok) sid = saved
        } catch (e) { }
        if (!sid) localStorage.removeItem('vedio_studio_sid')
      }
      if (!sid) {
        try {
          const r = await fetch('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: 'Vedio Studio 工作台', hide: true }),
          })
          if (!r.ok) throw new Error('HTTP ' + r.status)
          const s = await r.json()
          sid = s.id
          localStorage.setItem('vedio_studio_sid', sid)
        } catch (e) {
          console.warn('ensureSession failed', e)
          showToast('会话初始化失败：项目无法保存，可正常使用样例与导出')
        }
      }
    }
    bindPageExec()
    // 恢复上次打开的项目
    const last = localStorage.getItem('vedio_studio_last') || ''
    if (last && storageReady()) { try { await openProject(last) } catch (e) { } }
  }

  bindPageExec = () => {
    if (!sid || !$mod.$page_exec) {
      console.warn('vedio_studio: no session / page_exec')
      return
    }
    if (pe) { try { pe.stop() } catch (e) { } }
    pe = null
    pe = $mod.$page_exec(sid, [
      { name: 'list_video', description: '列出云端存储的视频项目与内置样例',
        handler: async () => {
          try {
            const list = await listProjects()
            return reply({ ok: true, current: curName, current_title: curTitle,
              files: list.map((p) => ({ name: p.name, title: p.title, duration: p.duration, scenes: p.scenes })),
              cases: cases.map((c) => ({ id: c.id, title: c.title, desc: c.desc })) })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'new_video', description: '新建视频项目（--name 必填，--title 可选，--width/--height 可选）',
        handler: async (argv) => {
          try {
            const name = normName(arg(argv, 'name'))
            if (!name) throw new Error('--name 必填')
            const title = arg(argv, 'title') || name
            const d = starterDoc()
            d.title = title
            const w = parseInt(arg(argv, 'width') || '0', 10), h = parseInt(arg(argv, 'height') || '0', 10)
            if (w >= 240 && h >= 240) d.size = { width: w, height: h }
            await fsPut(projIndex(name), JSON.stringify(d, null, 2))
            await openProject(name)
            return reply({ ok: true, name, path: projIndex(name), scenes: d.scenes.length, duration: Math.round(d.scenes.reduce((a, s) => a + s.duration, 0)) })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'open_video', description: '打开项目（--name 必填）',
        handler: async (argv) => {
          try {
            await openProject(arg(argv, 'name'))
            return reply({ ok: true, name: curName, title: curTitle, duration: Math.round((doc.totalFrames || 0) / (doc.fps || 30)) })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'read_video_file', description: '读项目内文件（--name 项目名，--path 相对路径如 index.json），返回文本',
        handler: async (argv) => {
          try {
            const name = normName(arg(argv, 'name'))
            const rel = normRel(arg(argv, 'path') || 'index.json')
            const r = await fsGet(projDir(name) + '/' + rel)
            return reply({ ok: true, path: rel, size: r.size, content: typeof r.content === 'string' ? r.content : '[binary]' })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'write_video_file', description: '写项目内文件（--name 项目名，--path 相对路径，--content JSON 文本）。写 index.json 后页面自动刷新',
        handler: async (argv) => {
          try {
            const name = normName(arg(argv, 'name'))
            const rel = normRel(arg(argv, 'path') || 'index.json')
            const content = arg(argv, 'content')
            if (content == null) throw new Error('--content 必填')
            await fsPut(projDir(name) + '/' + rel, content)
            if (rel === 'index.json' && name === curName) await reloadProject()
            return reply({ ok: true, path: rel, bytes: String(content).length })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'asset_download', description: '下载外部素材到项目（--name 项目名，--url 必填，--path 目标相对路径如 assets/bg.mp3）',
        handler: async (argv) => {
          try {
            const name = normName(arg(argv, 'name'))
            const url = arg(argv, 'url')
            if (!url) throw new Error('--url 必填')
            const rel = normRel(arg(argv, 'path') || 'assets/' + (url.split('/').pop() || 'asset.bin'))
            const r = await fetch(url)
            if (!r.ok) throw new Error('下载失败 HTTP ' + r.status)
            const blob = await r.blob()
            const out = await fsPut(projDir(name) + '/' + rel, blob)
            return reply({ ok: true, path: rel, size: out.bytes || blob.size })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'run_video', description: '预览播放当前项目（--name 可选，指定则先打开）',
        handler: async (argv) => {
          try {
            const n = arg(argv, 'name')
            if (n && n !== curName) await openProject(n)
            if (!doc) throw new Error('没有已打开的项目')
            $refs.stage.$data.togglePlay()
            return reply({ ok: true, playing: $refs.stage.$data.playing, title: curTitle })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'stop_video', description: '停止预览播放',
        handler: async () => {
          try {
            const st = $refs.stage.$data
            if (st.playing) st.togglePlay()
            return reply({ ok: true, playing: false })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'export_video', description: '导出当前项目为 MP4（--name 可选，--width/--height 可选分辨率，--fps 可选）',
        handler: async (argv) => {
          try {
            const n = arg(argv, 'name')
            if (n && n !== curName) await openProject(n)
            if (!doc) throw new Error('没有已打开的项目')
            const w = parseInt(arg(argv, 'width') || '0', 10), h = parseInt(arg(argv, 'height') || '0', 10)
            const fps = parseInt(arg(argv, 'fps') || '0', 10)
            const blob = await doExport({ width: w || 0, height: h || 0, fps: fps || 0 })
            const out = await fsPut(projRoot() + '/exports/' + safeTitle() + '.mp4', blob)
            downloadBlob(blob, safeTitle() + '.mp4')
            return reply({ ok: true, path: out.path, size: out.bytes || blob.size })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'delete_video', description: '删除项目（--name 必填，不可恢复）',
        handler: async (argv) => {
          try {
            const name = normName(arg(argv, 'name'))
            await rmDir(projDir(name))
            if (curName === name) { doc = null; curName = ''; curTitle = ''; saveState = '' }
            return reply({ ok: true, deleted: name })
          } catch (e) { return reply(errReply(e)) }
        } },

      { name: 'get_video', description: '当前打开项目的信息',
        handler: async () => {
          try {
            if (!doc) return reply({ ok: true, open: false })
            const st = $refs.stage.$data.engine ? $refs.stage.$data.engine.getState() : null
            return reply({ ok: true, open: true, name: curName, title: curTitle,
              duration: st ? Math.round(st.duration) : 0, fps: st ? st.fps : 0,
              size: st ? st.size : null, scenes: st ? st.scenes.length : 0 })
          } catch (e) { return reply(errReply(e)) }
        } },
    ])
  }

  const errReply = (e) => ({ ok: false, error: String((e && e.message) || e) })
  const reply = (obj) => ({ content: JSON.stringify(obj) })
  const arg = (argv, key, dft) => {
    const i = (argv || []).indexOf('--' + key)
    if (i >= 0 && argv[i + 1] !== undefined) return String(argv[i + 1])
    const pos = (argv || []).find((a) => typeof a === 'string' && !String(a).startsWith('--'))
    return pos !== undefined ? pos : dft
  }

  // ---- 项目读写 ----
  listProjects = async () => {
    const l = await fsLs(projRoot() + '/')
    const out = []
    for (const it of (l.items || [])) {
      if (!it.dir) continue
      try {
        const d = JSON.parse(await fsText(projDir(it.name) + '/index.json'))
        out.push({ name: it.name, title: d.title || it.name, duration: Math.round(((d.scenes || []).reduce((a, s) => a + (s.duration || 0), 0)) * 10) / 10, scenes: (d.scenes || []).length })
      } catch (e) { out.push({ name: it.name, title: it.name, duration: 0, scenes: 0 }) }
    }
    out.sort((a, b) => a.name.localeCompare(b.name))
    projects = out
    return out
  }

  loadAssets = async (d) => {
    assets = {}
    const stageEngine = $refs.stage?.$data?.engine
    const refs = stageEngine ? stageEngine.assetRefs() : []
    for (const ref of refs) {
      try {
        const r = await fsGet(projDir(curName) + '/' + ref)
        if (r.content instanceof Blob) {
          assets[ref] = await blobToDataURL(r.content)
        }
      } catch (e) { console.warn('asset missing:', ref, e) }
    }
  }

  blobToDataURL = (blob) => new Promise((res, rej) => {
    const fr = new FileReader()
    fr.onload = () => res(fr.result)
    fr.onerror = () => rej(fr.error || new Error('read blob failed'))
    fr.readAsDataURL(blob)
  })

  openProject = async (name) => {
    name = normName(name)
    const d = ensureTheme(JSON.parse(await fsText(projIndex(name))))
    curName = name
    curTitle = d.title || name
    doc = d
    sel = { kind: 'none', sceneIndex: 0, elId: '' }
    saveState = '已保存'
    try { localStorage.setItem('vedio_studio_last', name) } catch (e) { }
    await loadAssets(d)
    // 关键：传 sandbox 读出的 doc 代理（而非裸 d）——vhtml copyBind 保证同一
    // 代理对象贯穿后续赋值，stage 与父组件由此共享同一响应式图，
    // 舞台拖拽写入才能被 inspector 感知、被 doSave 持久化。
    $refs.stage.$data.setDoc(doc, assets)
    setBaseline()
    undoStack = []
    redoStack = []
    showToast('已打开：' + curTitle)
    return d
  }

  reloadProject = async () => {
    if (!curName) return
    const d = ensureTheme(JSON.parse(await fsText(projIndex(curName))))
    doc = d
    curTitle = d.title || curName
    // 选中态校验：元素/场景可能已被外部（AI）删除
    if (sel.kind === 'element') {
      const sc = d.scenes[sel.sceneIndex]
      if (!sc || !(sc.elements || []).some((e) => e.id === sel.elId)) sel = { kind: 'none', sceneIndex: 0, elId: '' }
    } else if (sel.kind === 'scene' && sel.sceneIndex >= d.scenes.length) {
      sel = { kind: 'none', sceneIndex: 0, elId: '' }
    }
    await loadAssets(d)
    $refs.stage.$data.setDoc(doc, assets)
    setBaseline()
  }

  newProject = async () => {
    if (!storageReady()) { showToast('会话未建立，无法保存项目'); return }
    const name = 'video-' + Date.now().toString(36)
    const d = starterDoc()
    d.title = '未命名视频'
    await fsPut(projIndex(name), JSON.stringify(d, null, 2))
    await openProject(name)
    showToast('已新建：' + name)
  }

  openCase = async (id) => {
    try {
      const r = await fetch('cases/' + id + '/index.json')
      if (!r.ok) throw new Error('样例不存在: ' + id)
      const d = ensureTheme(await r.json())
      curName = ''
      curTitle = d.title || id
      doc = d
      sel = { kind: 'none', sceneIndex: 0, elId: '' }
      saveState = ''
      assets = {}
      // 先装载以收集相对素材引用，再从样例目录预载为 dataURL（预览/导出共用）
      $refs.stage.$data.setDoc(doc, assets)
      const refs = $refs.stage.$data.engine ? $refs.stage.$data.engine.assetRefs() : []
      for (const ref of refs) {
        try {
          const ar = await fetch('cases/' + id + '/' + ref)
          if (ar.ok) assets[ref] = await blobToDataURL(await ar.blob())
        } catch (e) { console.warn('case asset missing:', ref, e) }
      }
      if (refs.length) $refs.stage.$data.setDoc(doc, assets)
      setBaseline()
      showCases = false
      showToast('已加载样例：' + curTitle + '（只读，右侧可另存为项目）')
    } catch (e) { showToast('加载样例失败：' + e.message) }
  }

  loadCases = async () => {
    try {
      const r = await fetch('cases/cases.json')
      const list = await r.json()
      cases = Array.isArray(list) ? list : (list.cases || [])
    } catch (e) { cases = [] }
  }

  saveAsProject = async () => {
    if (!doc || curName) return
    if (!storageReady()) { showToast('会话未建立，无法保存'); return }
    const name = 'video-' + Date.now().toString(36)
    await fsPut(projIndex(name), JSON.stringify(doc, null, 2))
    await openProject(name)
    showToast('已另存为项目：' + name + '，现在可以编辑了')
  }

  deleteProject = async (name) => {
    await rmDir(projDir(name))
    if (curName === name) { doc = null; curName = ''; curTitle = ''; saveState = '' }
    showToast('已删除：' + name)
    await refreshProjects()
  }

  refreshProjects = async () => {
    try { await listProjects() } catch (e) { }
  }

  safeTitle = () => String(curTitle || curName || 'video').replace(/[\\/:*?"<>|#%\s]+/g, '-').slice(0, 60)

  downloadBlob = (blob, filename) => {
    const u = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = u
    a.download = filename
    document.body.appendChild(a)
    a.click()
    a.remove()
    setTimeout(() => URL.revokeObjectURL(u), 10000)
  }

  // ---- 编辑历史（undo/redo）与剪贴板 ----
  undoStack = []        // 公开数组（vhtml 响应式，驱动按钮态）；写入走「拷贝→改→赋回」
  redoStack = []
  let lastJson = ''     // 上一次变更后的 doc 序列化（快照基准）
  let clipboard = ''    // 元素 JSON（应用内剪贴板）

  setBaseline = () => { lastJson = doc ? JSON.stringify(doc) : '' }

  // 任何 doc 变更后调用：把「变更前」快照入 undo 栈
  // tag 相同的连续变更（如方向键微调）在 1s 窗口内合并为一条历史
  let lastTag = ''
  let lastPushT = 0
  pushHistory = (tag) => {
    if (!doc) { lastJson = ''; return }
    if (!curName) { setBaseline(); return }   // 样例只读，不入栈
    const j = JSON.stringify(doc)
    if (j === lastJson) return
    const now = Date.now()
    if (lastJson) {
      const coalesce = tag && tag === lastTag && now - lastPushT < 1000
      if (!coalesce) {
        undoStack = undoStack.concat([lastJson]).slice(-100)
        redoStack = []
      }
    }
    lastJson = j
    lastTag = tag || ''
    lastPushT = now
  }

  applyJson = (j) => {
    const d = ensureTheme(JSON.parse(j))
    doc = d
    curTitle = d.title || curName
    sel = { kind: 'none', sceneIndex: 0, elId: '' }
    sceneVer++
    $refs.stage.$data.setDoc(doc, assets)
    scheduleSave()
  }

  undoEdit = () => {
    if (!undoStack.length || !curName) return
    redoStack = redoStack.concat([lastJson])
    lastJson = undoStack[undoStack.length - 1]
    undoStack = undoStack.slice(0, -1)
    applyJson(lastJson)
  }

  redoEdit = () => {
    if (!redoStack.length || !curName) return
    undoStack = undoStack.concat([lastJson])
    lastJson = redoStack[redoStack.length - 1]
    redoStack = redoStack.slice(0, -1)
    applyJson(lastJson)
  }

  copyElement = () => {
    if (sel.kind !== 'element' || !curName) return
    const sc = doc.scenes[sel.sceneIndex]
    if (!sc) return
    const ids = sel.elIds && sel.elIds.length ? sel.elIds : [sel.elId]
    const els = (sc.elements || []).filter((e) => ids.indexOf(e.id) >= 0)
    if (!els.length) return
    clipboard = JSON.stringify(els.length === 1 ? els[0] : els)
    showToast('已复制 ' + els.length + ' 个元素')
  }

  pasteElement = () => {
    if (!clipboard || !canEdit()) return
    const parsed = JSON.parse(clipboard)
    const list = Array.isArray(parsed) ? parsed : [parsed]
    const i = activeSceneIdx()
    const news = []
    spliceEls(doc.scenes[i], (a) => {
      for (const src of list) {
        const el = JSON.parse(JSON.stringify(src))
        el.id = (el.type || 'el') + '-' + uid()
        el.x = (+el.x || 0) + 24
        el.y = (+el.y || 0) + 24
        a.push(el)
        news.push(el.id)
      }
    })
    if (!news.length) return
    sel = { kind: 'element', sceneIndex: i, elId: news[news.length - 1], elIds: news }
    onDocChange()
    showToast('已粘贴 ' + news.length + ' 个元素')
  }

  // 方向键微调选中元素（1px，Shift=10px；连续微调合并为一条历史）
  nudgeSelected = (dx, dy) => {
    const sc = doc.scenes[sel.sceneIndex]
    if (!sc) return
    const r1 = (v) => Math.round(v * 10) / 10
    let hit = false
    for (const el of (sc.elements || [])) {
      if (sel.elIds.indexOf(el.id) < 0) continue
      // x/y 关键帧轨道驱动位置的元素：平移轨道
      if (Array.isArray(el.keyframes) && el.keyframes.some((k) => k.x != null || k.y != null)) {
        el.keyframes = el.keyframes.map((k) => {
          const c = Object.assign({}, k)
          if (c.x != null) c.x = r1(c.x + dx)
          if (c.y != null) c.y = r1(c.y + dy)
          return c
        })
      } else {
        el.x = r1((+el.x || 0) + dx)
        el.y = r1((+el.y || 0) + dy)
      }
      hit = true
    }
    if (!hit) return
    $refs.stage.$data.refreshFrame()
    pushHistory('nudge')
    scheduleSave()
  }

  // 场景跳转：d=-1 上一场景起点，d=1 下一场景起点
  jumpScene = (d) => {
    const st = $refs.stage && $refs.stage.$data
    if (!st || !st.doc || !st.scenes || !st.scenes.length) return
    const fr = st.engine.frame
    if (d > 0) {
      const nx = st.scenes.find((s) => s.start > fr)
      st.seekFrame(nx ? nx.start : st.totalFrames - 1)
    } else {
      let at = st.scenes[0]
      for (const s of st.scenes) { if (s.start < fr) at = s; else break }
      st.seekFrame(at.start)
    }
  }

  // ---- 保存 ----
  scheduleSave = () => {
    if (!curName || !storageReady()) return
    saveState = '未保存'
    clearTimeout(saveTimer)
    saveTimer = setTimeout(doSave, 600)
  }
  doSave = async () => {
    if (!curName || !storageReady()) return
    saveState = '保存中…'
    try {
      await fsPut(projIndex(curName), JSON.stringify(doc, null, 2))
      saveState = '已保存'
    } catch (e) {
      console.error('save failed', e)
      saveState = '保存失败'
    }
  }

  // ---- 编辑数据流（§2.3）----
  canEdit = () => {
    if (!doc) return false
    if (!curName) {
      rtab = 'props'
      showToast('样例为只读：请先在右侧「另存为项目」')
      return false
    }
    return true
  }

  onDocChange = () => {
    curTitle = (doc && doc.title) || curName
    pushHistory()
    $refs.stage.$data.refreshFrame()
    scheduleSave()
  }
  onStageChange = () => {
    pushHistory()
    scheduleSave()
  }

  // ---- 选中模型 ----
  activeSceneIdx = () => {
    if (!doc) return 0
    let acc = 0
    for (let i = 0; i < doc.scenes.length; i++) {
      const fr = Math.max(1, Math.round((+doc.scenes[i].duration || 1) * doc.fps))
      if (curFrame < acc + fr) return i
      acc += fr
    }
    return Math.max(0, doc.scenes.length - 1)
  }

  sceneStartFrame = (i) => {
    let acc = 0
    for (let k = 0; k < i; k++) acc += Math.max(1, Math.round((+doc.scenes[k].duration || 1) * doc.fps))
    return acc
  }

  onPickScene = (i) => {
    if (!doc) return
    i = Math.max(0, Math.min(i, doc.scenes.length - 1))
    sel = { kind: 'scene', sceneIndex: i, elId: '' }
    $refs.stage.$data.seekFrame(sceneStartFrame(i))
  }
  onStageSelect = (s) => {
    if (s && s.kind === 'element') {
      sel = { kind: 'element', sceneIndex: s.sceneIndex, elId: s.id, elIds: s.ids || [s.id] }
    } else {
      sel = { kind: 'scene', sceneIndex: activeSceneIdx(), elId: '', elIds: [] }
    }
  }
  onPickEl = (id) => {
    sel = { kind: 'element', sceneIndex: activeSceneIdx(), elId: id }
  }
  onSeek = (f) => {
    $refs.stage.$data.seekFrame(f)
  }
  selNone = () => {
    if (!doc) return
    sel = { kind: 'none', sceneIndex: activeSceneIdx(), elId: '' }
    rtab = 'props'
  }

  // ---- 场景操作 ----
  // 注意：vhtml Wrap 代理数组上直接 splice 会复制插入项（已踩坑）——
  // 统一走「拷贝 → 改 → 赋回」模式（赋值经 copyBind 数组合并，安全可靠）
  const spliceScenes = (fn) => {
    const arr = doc.scenes.slice()
    fn(arr)
    doc.scenes = arr
  }
  const spliceEls = (sc, fn) => {
    const arr = (sc.elements || []).slice()
    fn(arr)
    sc.elements = arr
  }
  addScene = () => {
    if (!canEdit()) return
    const i = sel.sceneIndex != null ? sel.sceneIndex : doc.scenes.length - 1
    const at = Math.min(i, doc.scenes.length - 1) + 1
    spliceScenes((a) => a.splice(at, 0, {
      id: 's' + uid(), duration: 3, transition: 'fade', transitionIn: 0.6,
      elements: [],
    }))
    sceneVer++
    onPickScene(at)
    onDocChange()
  }
  dupScene = (i) => {
    if (!canEdit()) return
    const c = JSON.parse(JSON.stringify(doc.scenes[i]))
    c.id = 's' + uid()
    spliceScenes((a) => a.splice(i + 1, 0, c))
    sceneVer++
    onPickScene(i + 1)
    onDocChange()
  }
  delScene = (i) => {
    if (!canEdit() || doc.scenes.length <= 1) return
    spliceScenes((a) => a.splice(i, 1))
    sceneVer++
    const ni = Math.max(0, Math.min(i, doc.scenes.length - 1))
    onPickScene(ni)
    onDocChange()
  }
  moveScene = ({ i, d }) => {
    if (!canEdit()) return
    const j = i + d
    if (j < 0 || j >= doc.scenes.length) return
    spliceScenes((a) => {
      const t = a[i]
      a.splice(i, 1)
      a.splice(j, 0, t)
    })
    sceneVer++
    onPickScene(j)
    onDocChange()
  }

  // ---- 元素操作 ----
  makeElement = (type, sub) => {
    const W = doc.size.width, H = doc.size.height
    const id = (type === 'shape' ? sub : type) + '-' + uid()
    const base = { id, type, x: Math.round(W / 2 - 160), y: Math.round(H / 2 - 45), w: 320, h: 90 }
    if (type === 'text') return Object.assign(base, {
      html: '双击编辑文本', fontSize: 42, fontWeight: 600, color: doc.theme.color,
      align: 'center', valign: 'middle', fx: { enter: 'fade-up', enterDur: 0.6, delay: 0.2 },
    })
    if (type === 'shape') {
      const o = Object.assign(base, { shape: sub || 'rect', fill: doc.theme.accent, w: 240, h: 170 })
      if (sub === 'rect') o.radius = 14
      if (sub === 'arrow') { o.direction = 'right'; o.h = 90 }
      if (sub === 'triangle') { o.w = 200; o.h = 180 }
      return o
    }
    if (type === 'image') return Object.assign(base, { w: 360, h: 220, src: '', fit: 'contain' })
    if (type === 'chart') return Object.assign(base, {
      w: 560, h: 340, x: Math.round(W / 2 - 280), y: Math.round(H / 2 - 170),
      option: { xAxis: { data: ['Q1', 'Q2', 'Q3', 'Q4'] }, series: [{ type: 'bar', data: [120, 210, 340, 520] }] },
    })
    if (type === 'table') return Object.assign(base, {
      w: 480, h: 220, x: Math.round(W / 2 - 240), y: Math.round(H / 2 - 110),
      columns: [{ w: 0.6 }, { w: 0.4 }],
      rows: [
        { cells: [{ html: '名称', bold: true }, { html: '数值', bold: true }] },
        { cells: [{ html: '项目 A' }, { html: '12' }] },
        { cells: [{ html: '项目 B' }, { html: '34' }] },
      ],
      header: true,
      style: { fontSize: 16, color: '#e2e8f0', headerBg: doc.theme.accent, borderColor: 'rgba(255,255,255,0.15)' },
    })
    return base
  }

  onAddEl = ({ type, sub }) => {
    if (!canEdit() || !doc) return
    const i = activeSceneIdx()
    const sc = doc.scenes[i]
    if (!sc) return
    const el = makeElement(type, sub)
    spliceEls(sc, (a) => a.push(el))
    sel = { kind: 'element', sceneIndex: i, elId: el.id }
    onDocChange()
    showToast('已添加元素：' + el.id)
  }

  delElement = (id) => delElements([id])

  delElements = (ids) => {
    if (!canEdit() || !ids || !ids.length) return
    const sc = doc.scenes[sel.sceneIndex]
    if (!sc) return
    spliceEls(sc, (a) => {
      for (const id of ids) {
        const i = a.findIndex((e) => e.id === id)
        if (i >= 0) a.splice(i, 1)
      }
    })
    sel = { kind: 'scene', sceneIndex: sel.sceneIndex, elId: '', elIds: [] }
    onDocChange()
  }

  dupElement = (id) => dupElements([id])

  dupElements = (ids) => {
    if (!canEdit() || !ids || !ids.length) return
    const sc = doc.scenes[sel.sceneIndex]
    if (!sc) return
    const news = []
    spliceEls(sc, (a) => {
      for (const id of ids) {
        const el = a.find((e) => e.id === id)
        if (!el) continue
        const c = JSON.parse(JSON.stringify(el))
        c.id = (c.type || 'el') + '-' + uid()
        c.x = (+c.x || 0) + 24
        c.y = (+c.y || 0) + 24
        a.push(c)
        news.push(c.id)
      }
    })
    if (!news.length) return
    sel = { kind: 'element', sceneIndex: sel.sceneIndex, elId: news[news.length - 1], elIds: news }
    onDocChange()
  }

  // 场景拖拽排序：from → to（移除后的插入下标）
  moveSceneTo = ({ from, to }) => {
    if (!canEdit()) return
    to = Math.max(0, Math.min(to, doc.scenes.length - 1))
    if (from === to) return
    spliceScenes((a) => {
      const t = a[from]
      a.splice(from, 1)
      a.splice(to, 0, t)
    })
    sceneVer++
    onPickScene(to)
    onDocChange()
  }

  // ---- 素材上传 ----
  uploadAsset = async (file) => {
    if (!curName || !storageReady()) throw new Error('请先新建或另存为项目')
    const ext = (String((file.name || '').split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin')
    const ref = 'assets/' + Date.now().toString(36) + '.' + ext
    await fsPut(projDir(curName) + '/' + ref, file)
    const dataUrl = await blobToDataURL(file)
    assets[ref] = dataUrl
    return ref
  }

  // ---- 导出 ----
  doExport = async (opts) => {
    const { exportVideo } = await import('./video/render.js')
    exporting = true
    showCases = false
    showProjects = false
    try {
      const engine = $refs.stage.$data.engine
      const blob = await exportVideo(engine, {
        width: opts.width || 0,
        height: opts.height || 0,
        fps: opts.fps || 0,
        onProgress: (p) => {
          $refs.stage.$data.setExporting(true, p.pct, p.phase === 'audio' ? '混音与封装…' : '渲染帧 ' + p.frame + '/' + p.total)
        },
      })
      return blob
    } finally {
      exporting = false
      $refs.stage.$data.setExporting(false)
    }
  }

  exportMp4 = async () => {
    if (!doc || exporting) return
    try {
      showToast('开始导出…')
      const blob = await doExport({})
      downloadBlob(blob, safeTitle() + '.mp4')
      if (storageReady()) {
        try {
          await fsPut(projRoot() + '/exports/' + safeTitle() + '.mp4', blob)
        } catch (e) { console.warn('export saved to cloud fs failed:', e) }
      }
      showToast('导出完成：' + safeTitle() + '.mp4')
    } catch (e) {
      console.error(e)
      showToast('导出失败：' + (e && e.message ? e.message : e))
    }
  }

  initPage()
</script>
<script>
  // rAF 循环：同步舞台当前帧 → 顶层标量 curFrame（驱动时间轴 playhead 与属性面板）
  const frameLoop = () => {
    const st = $refs.stage
    curFrame = (st && st.$data.engine && st.$data.engine.frame) || 0
    requestAnimationFrame(frameLoop)
  }
  requestAnimationFrame(frameLoop)

  // 快捷键（焦点在输入控件时不生效；Cmd/Ctrl 组合键除外）
  window.addEventListener('keydown', (e) => {
    const t = e.target
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)
    const meta = e.metaKey || e.ctrlKey
    const k = e.key

    // ---- Cmd/Ctrl 组合：undo/redo + 剪贴板 ----
    if (meta && !typing) {
      const lk = k.toLowerCase()
      if (lk === 'z') { e.preventDefault(); e.shiftKey ? redoEdit() : undoEdit(); return }
      if (lk === 'y') { e.preventDefault(); redoEdit(); return }
      if (lk === 'c') { copyElement(); return }
      if (lk === 'v') { pasteElement(); return }
      if (lk === 'd') { e.preventDefault(); if (sel.kind === 'element') dupElement(sel.elId); return }
    }
    if (typing) return

    const st = $refs.stage
    if (e.code === 'Space') {
      e.preventDefault()
      if (st && st.$data.doc) st.$data.togglePlay()
      return
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (!doc || !curName) return
      e.preventDefault()
      if (sel.kind === 'element') delElements(sel.elIds && sel.elIds.length ? sel.elIds : [sel.elId])
      else if (sel.kind === 'scene') delScene(sel.sceneIndex)
      return
    }
    if (e.key === 'Escape') { selNone(); return }

    // ---- 选中元素时方向键 = 微调（1px，Shift=10px）----
    if (sel.kind === 'element' && sel.elIds && sel.elIds.length && curName &&
        (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault()
      const d = e.shiftKey ? 10 : 1
      nudgeSelected(
        e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0,
        e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0,
      )
      return
    }

    // ---- 走带控制（Remotion 风格）----
    if (!st || !st.$data.doc || exporting) return
    const S = st.$data
    if (e.key === 'ArrowLeft') { e.preventDefault(); S.stepFrame(e.shiftKey ? -10 : -1) }
    else if (e.key === 'ArrowRight') { e.preventDefault(); S.stepFrame(e.shiftKey ? 10 : 1) }
    else if (e.key === 'Home') { e.preventDefault(); S.seekFrame(0) }
    else if (e.key === 'End') { e.preventDefault(); S.seekFrame(S.totalFrames - 1) }
    else if (e.key === 'ArrowUp') { e.preventDefault(); jumpScene(-1) }
    else if (e.key === 'ArrowDown') { e.preventDefault(); jumpScene(1) }
    else if (k === 'j' || k === 'J') { S.shuttle(-1) }
    else if (k === 'k' || k === 'K') { S.shuttle(0) }
    else if (k === 'l' || k === 'L') { S.shuttle(1) }
  })
</script>
