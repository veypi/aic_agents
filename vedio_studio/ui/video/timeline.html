<!DOCTYPE html>
<html>
  <head><title>Video Timeline</title></head>
  <style>
    body { display: flex; flex-direction: column; height: 100%; min-height: 0; background: rgba(13, 17, 28, 0.9); border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .tl-bar {
      flex: none; display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .tl-sec { font-size: 12px; color: #64748b; font-weight: 600; letter-spacing: 0.5px; margin-right: 4px; }
    .tl-adds { display: flex; gap: 4px; flex-wrap: wrap; }
    .tl-adds button {
      border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.04);
      color: #94a3b8; font-size: 11.5px; padding: 3px 9px; border-radius: 6px; cursor: pointer;
    }
    .tl-adds button:hover { background: rgba(67, 97, 238, 0.25); color: #e0e7ff; border-color: rgba(67, 97, 238, 0.4); }
    .tl-adds button:disabled { opacity: 0.4; cursor: not-allowed; }
    .sp { flex: 1; }
    .tl-time { font-size: 11.5px; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .tl-zoom {
      background: rgba(255, 255, 255, 0.06); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px; font-size: 11px; padding: 2px 4px; outline: none;
    }
    .tl-scroll { flex: 1; overflow: auto; position: relative; }
    .tl-inner { position: relative; min-width: 100%; padding-bottom: 6px; }

    .tl-ruler { position: relative; height: 22px; cursor: ew-resize; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .tl-tick { position: absolute; top: 0; height: 100%; border-left: 1px solid rgba(255, 255, 255, 0.13); padding-left: 3px; font-size: 10px; color: #64748b; line-height: 20px; user-select: none; }
    .tl-tick.minor { border-left-color: rgba(255, 255, 255, 0.05); }

    .tl-row { position: relative; height: 26px; margin-top: 4px; }
    .tl-scene {
      position: absolute; top: 0; height: 100%; border-radius: 5px;
      background: rgba(67, 97, 238, 0.16); border: 1px solid rgba(67, 97, 238, 0.35);
      color: #a5b4fc; font-size: 11px; line-height: 24px; padding: 0 7px;
      cursor: pointer; overflow: hidden; white-space: nowrap; box-sizing: border-box;
    }
    .tl-scene:hover { background: rgba(67, 97, 238, 0.28); }
    .tl-scene.active { background: rgba(67, 97, 238, 0.4); border-color: #6366f1; color: #fff; }
    .tl-scene.moving { opacity: 0.55; cursor: grabbing; }
    .tl-tr { color: #818cf8; margin-left: 4px; }
    .tl-dur { color: #64748b; font-size: 10px; margin-left: 5px; }
    .tl-edge { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 2; }
    .tl-edge.l { left: 0; }
    .tl-edge.r { right: 0; }
    .tl-edge:hover { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }
    .tl-drop { position: absolute; top: 20px; bottom: 0; width: 2px; background: #f472b6; z-index: 6; pointer-events: none; }

    .tl-elrow { position: relative; height: 22px; margin-top: 2px; cursor: pointer; }
    .tl-elbar {
      position: absolute; top: 2px; height: 18px; border-radius: 4px;
      background: rgba(148, 163, 184, 0.13); border: 1px solid rgba(148, 163, 184, 0.22);
      box-sizing: border-box; overflow: hidden;
    }
    .tl-elrow:hover .tl-elbar { background: rgba(148, 163, 184, 0.22); }
    .tl-elrow.active .tl-elbar { background: rgba(34, 197, 94, 0.22); border-color: rgba(34, 197, 94, 0.55); }
    .tl-elname {
      position: absolute; left: 5px; top: 0; font-size: 10.5px; line-height: 18px;
      color: #94a3b8; white-space: nowrap; pointer-events: none;
    }
    .tl-elrow.active .tl-elname { color: #bbf7d0; }
    /* media 剪辑块：绿色块表示 [start, start+dur] 窗口，左右边缘拖拽改开始/出点 */
    .tl-mblock {
      position: absolute; top: 2px; height: 18px; border-radius: 4px; box-sizing: border-box;
      background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.55);
      overflow: hidden;
    }
    .tl-elrow:hover .tl-mblock { background: rgba(34, 197, 94, 0.3); }
    .tl-elrow.active .tl-mblock { background: rgba(34, 197, 94, 0.38); border-color: rgba(34, 197, 94, 0.8); }
    .tl-medge { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 2; }
    .tl-medge.l { left: 0; }
    .tl-medge.r { right: 0; }
    .tl-medge:hover { background: rgba(134, 239, 172, 0.55); }
    .tl-kf {
      position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
      background: #fbbf24; transform: rotate(45deg); border-radius: 1px;
      cursor: ew-resize; z-index: 3;
    }
    .tl-kf:hover { background: #fde68a; box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.3); }
    .tl-playhead {
      position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid #f43f5e;
      pointer-events: none; z-index: 5;
    }
    .tl-playhead::before {
      content: ''; position: absolute; top: 0; left: -5.5px;
      border: 5px solid transparent; border-top: 7px solid #f43f5e;
    }
    .tl-empty { padding: 18px; text-align: center; color: #4b5563; font-size: 12px; }
  </style>
  <body>
    <div class="tl-bar">
      <span class="tl-sec">时间轴</span>
      <div class="tl-adds">
        <button @click="add('text')" :disabled="readonly || !doc">+ 文本</button>
        <button @click="add('shape', 'rect')" :disabled="readonly || !doc">+ 矩形</button>
        <button @click="add('shape', 'ellipse')" :disabled="readonly || !doc">+ 椭圆</button>
        <button @click="add('shape', 'triangle')" :disabled="readonly || !doc">+ 三角</button>
        <button @click="add('shape', 'arrow')" :disabled="readonly || !doc">+ 箭头</button>
        <button @click="add('image')" :disabled="readonly || !doc">+ 图片</button>
        <button @click="add('chart')" :disabled="readonly || !doc">+ 图表</button>
        <button @click="add('table')" :disabled="readonly || !doc">+ 表格</button>
      </div>
      <div class="sp"></div>
      <span class="tl-time">{{ fmtT(frame / fpsOf()) }} / {{ fmtT(totalDur()) }}</span>
      <select class="tl-zoom" :value="pps" @change="setPps(+$event.target.value)">
        <option value="30" :selected="pps === 30">缩放 30px/s</option>
        <option value="60" :selected="pps === 60">缩放 60px/s</option>
        <option value="100" :selected="pps === 100">缩放 100px/s</option>
      </select>
    </div>
    <div class="tl-scroll" ref="scroll" @dragover="onDragOverAsset" @drop="onDropAsset">
      <div class="tl-inner" ref="inner" :style="{ width: innerW() + 'px' }" v-if="doc">
        <div class="tl-ruler" @mousedown="onRulerDown">
          <div v-for="t in ticks()" :key="t.x" class="tl-tick" :class="{ minor: !t.major }" :style="{ left: t.x + 'px' }">{{ t.label }}</div>
        </div>
        <div class="tl-row">
          <div v-for="b in blocks()" :key="ver + ':' + kver + ':' + b.id" class="tl-scene" :class="{ active: b.i === curSceneIdx(), moving: moveI === b.i }"
               :style="{ left: b.x + 'px', width: b.w + 'px' }"
               @mousedown="onSceneDown(b, $event)">
            S{{ b.i + 1 }}<span v-if="b.trans" class="tl-tr">⇢</span><span class="tl-dur">{{ b.dur }}</span>
            <div class="tl-edge l" title="拖拽改上一场景时长" @mousedown.stop="onEdgeDown(b.i - 1, $event)"></div>
            <div class="tl-edge r" title="拖拽改本场景时长" @mousedown.stop="onEdgeDown(b.i, $event)"></div>
          </div>
          <div class="tl-drop" v-if="dropX >= 0" :style="{ left: dropX + 'px' }"></div>
        </div>
        <div class="tl-elrow" v-for="el in curEls()" :key="kver + ':' + el.id" :class="{ active: sel && sel.kind === 'element' && sel.elIds && sel.elIds.indexOf(el.id) >= 0 }" @click="pickEl(el.id)">
          <template v-if="el.type === 'media'">
            <div class="tl-mblock" :style="mediaBlockStyle(el)" :title="'左缘拖拽改开始时间，右缘拖拽裁剪出点（当前 ' + (mediaDur(el)).toFixed(1) + 's）'">
              <div class="tl-medge l" @mousedown.stop="onMediaEdgeDown(el, 'l', $event)"></div>
              <div class="tl-medge r" @mousedown.stop="onMediaEdgeDown(el, 'r', $event)"></div>
            </div>
          </template>
          <template v-else>
            <div class="tl-elbar" :style="elBarStyle()">
              <div v-for="(k, ki) in (el.keyframes || [])" :key="ki" class="tl-kf" :style="{ left: kfX(k) }"
                   :title="'t=' + k.t + 's（拖拽改时间，Alt+点击删除）'" @mousedown.stop="onKfDown(el, k, ki, $event)"></div>
            </div>
          </template>
          <span class="tl-elname" :style="{ left: (elNameX() + 10) + 'px' }">{{ el.id }} · {{ el.type }}</span>
        </div>
        <div class="tl-playhead" :style="{ left: playX() + 'px' }"></div>
      </div>
      <div class="tl-empty" v-if="!doc">打开项目后此处显示时间轴</div>
    </div>
  </body>
  <script setup>
    doc = null         // prop
    frame = 0          // prop：当前帧（父级 rAF 同步）
    sel = null         // prop：{ kind, sceneIndex, elId, elIds }
    readonly = false   // prop
    ver = 0            // prop：场景结构版本号
    pps = 60           // 像素/秒（Ctrl+滚轮 10–240 连续缩放）
    moveI = -1         // 正在拖拽排序的场景下标
    dropX = -1         // 插入位指示线（px，<0 隐藏）
    kver = 0           // keyed 列表重建版本号：原地写 doc（时长/关键帧/pps）后 ++，
                       // 拼进 :key 强制 v-for 重建（vhtml keyed 列表同 key 复用旧值）

    fpsOf = () => (doc && doc.fps) || 30
    let rafP = false
    sceneFrames = (s) => Math.max(1, Math.round((+s.duration || 1) * fpsOf()))

    // 素材拖到时间轴：插入当前场景（默认位置，父级处理）；readonly 时不响应
    onDragOverAsset = (e) => {
      if (readonly) return
      e.preventDefault()
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'
    }
    onDropAsset = (e) => {
      if (readonly) return
      e.preventDefault()
      const ref = e.dataTransfer && e.dataTransfer.getData('application/x-vedio-asset')
      if (!ref) return
      $emit('dropasset', {ref})
    }

    blocks = () => {
      if (!doc) return []
      let acc = 0
      return doc.scenes.map((s, i) => {
        const fr = sceneFrames(s)
        const b = {
          id: s.id, i,
          startF: acc, frames: fr,
          x: (acc / fpsOf()) * pps,
          w: (fr / fpsOf()) * pps,
          dur: (+s.duration || 0).toFixed(1) + 's',
          trans: i > 0 && s.transition && s.transition !== 'none',
        }
        acc += fr
        return b
      })
    }

    totalDur = () => {
      const bs = blocks()
      if (!bs.length) return 0
      const last = bs[bs.length - 1]
      return (last.startF + last.frames) / fpsOf()
    }

    innerW = () => Math.max(totalDur() * pps + 60, 200)

    curSceneIdx = () => {
      const bs = blocks()
      for (let i = 0; i < bs.length; i++) {
        if (frame < bs[i].startF + bs[i].frames) return i
      }
      return Math.max(0, bs.length - 1)
    }

    ticks = () => {
      const dur = totalDur()
      const out = []
      const step = pps >= 50 ? 0.5 : 1
      for (let t = 0; t <= Math.ceil(dur) + 0.001; t += step) {
        const major = Math.abs(t - Math.round(t)) < 0.001
        out.push({ x: Math.round(t * pps * 100) / 100, major, label: major ? fmtS(Math.round(t)) : '' })
      }
      return out
    }

    playX = () => (frame / fpsOf()) * pps

    curEls = () => {
      if (!doc) return []
      const sc = doc.scenes[curSceneIdx()]
      return sc ? (sc.elements || []) : []
    }

    elBarStyle = () => {
      const b = blocks()[curSceneIdx()]
      if (!b) return {}
      return { left: b.x + 'px', width: Math.max(6, b.w) + 'px' }
    }
    elNameX = () => {
      const b = blocks()[curSceneIdx()]
      return b ? b.x : 0
    }
    kfX = (k) => ((+k.t || 0) * pps) + 'px'

    // ---- media 剪辑块：场景内 [start, start+dur]，dur 受场景剩余与 trim 窗口约束 ----
    mediaDur = (el) => {
      const sc = doc.scenes[curSceneIdx()]
      const sceneDur = sc ? (+sc.duration || 1) : 1
      const start = +el.start || 0
      const ts = +el.trimStart || 0
      const te = el.trimEnd >= 0 ? +el.trimEnd : 1e9
      return Math.max(0.1, Math.min(sceneDur - start, te - ts))
    }
    mediaBlockStyle = (el) => {
      // 与其它行一致钉在当前场景块上：场景 x 偏移 + 场景内 start
      const b = blocks()[curSceneIdx()]
      const start = +el.start || 0
      return {left: ((b ? b.x : 0) + start * pps) + 'px', width: (mediaDur(el) * pps) + 'px'}
    }
    // 左缘拖 = 改开始时间（场景内）；右缘拖 = 裁剪出点（显示时长）；松手上报 docchange 保存
    onMediaEdgeDown = (el, which, e) => {
      if (readonly) return
      e.preventDefault()
      e.stopPropagation()
      const sc = doc.scenes[curSceneIdx()]
      const sceneDur = sc ? (+sc.duration || 1) : 1
      const ts = +el.trimStart || 0
      const x0 = e.clientX
      const t0 = which === 'l' ? (+el.start || 0) : mediaDur(el)
      const onMove = (ev) => {
        const dt = (ev.clientX - x0) / pps
        if (which === 'l') {
          const maxS = Math.max(0, sceneDur - mediaDur(el))
          el.start = Math.round(Math.min(maxS, Math.max(0, t0 + dt)) * 100) / 100
        } else {
          const maxD = Math.max(0.1, sceneDur - (+el.start || 0))
          el.trimEnd = Math.round((ts + Math.min(maxD, Math.max(0.1, t0 + dt))) * 100) / 100
        }
        kver++
      }
      const onUp = () => {
        document.removeEventListener('mousemove', onMove)
        document.removeEventListener('mouseup', onUp)
        $emit('docchange')
      }
      document.addEventListener('mousemove', onMove)
      document.addEventListener('mouseup', onUp)
    }

    /* ---------------- 事件 ---------------- */
    add = (type, sub) => { if (!readonly) $emit('addel', { type, sub }) }
    pickEl = (id) => $emit('pickel', id)

    setPps = (v) => { pps = v; kver++ }

    onSceneDown = (b, e) => {
      if (!doc || e.button !== 0) return
      const inner = $refs.inner
      if (!inner) return
      const rect = inner.getBoundingClientRect()
      const x0 = e.clientX
      let moved = false
      let dropTo = -1
      const mv = (ev) => {
        if (!moved && Math.abs(ev.clientX - x0) < 5) return
        if (readonly) return
        moved = true
        moveI = b.i
        // 插入位：按各场景块中点判定
        const bs = blocks()
        const mx = ev.clientX - rect.left
        let to = bs.length
        for (let k = 0; k < bs.length; k++) {
          if (mx < bs[k].x + bs[k].w / 2) { to = k; break }
        }
        dropTo = to
        dropX = bs[to] ? bs[to].x : (bs.length ? bs[bs.length - 1].x + bs[bs.length - 1].w : 0)
      }
      const up = () => {
        window.removeEventListener('mousemove', mv)
        window.removeEventListener('mouseup', up)
        if (moved && dropTo >= 0) {
          // 移除自身后的插入下标修正
          const to = dropTo > b.i ? dropTo - 1 : dropTo
          if (to !== b.i) $emit('movescene', { from: b.i, to })
        } else if (!moved) {
          $emit('pickscene', b.i)
          $emit('seek', b.startF)
        }
        moveI = -1
        dropX = -1
      }
      window.addEventListener('mousemove', mv)
      window.addEventListener('mouseup', up)
    }

    /* 边缘拖拽改场景时长（左边 = 上一场景） */
    onEdgeDown = (i, e) => {
      if (readonly || !doc) return
      const s = doc.scenes[i]
      if (!s) return
      e.preventDefault()
      const d0 = +s.duration || 1
      const x0 = e.clientX
      let changed = false
      const mv = (ev) => {
        const nd = Math.max(0.5, Math.round((d0 + (ev.clientX - x0) / pps) * 10) / 10)
        if (nd !== (+s.duration || 0)) {
          s.duration = nd
          changed = true
          if (!rafP) { rafP = true; requestAnimationFrame(() => { rafP = false; kver++ }) }
        }
      }
      const up = () => {
        window.removeEventListener('mousemove', mv)
        window.removeEventListener('mouseup', up)
        if (changed) $emit('docchange')
      }
      window.addEventListener('mousemove', mv)
      window.addEventListener('mouseup', up)
    }

    /* 关键帧菱形拖拽改时间（拖动中本地摆位，松手一次性重建+上报）；Alt+点击删除 */
    onKfDown = (el, k, ki, e) => {
      if (readonly || e.button !== 0) return
      e.preventDefault()
      if (e.altKey) {
        const arr = (el.keyframes || []).slice()
        arr.splice(ki, 1)
        el.keyframes = arr
        kver++
        $emit('docchange')
        return
      }
      const bar = e.currentTarget.closest('.tl-elbar')
      if (!bar) return
      const dot = e.currentTarget
      const barL = bar.getBoundingClientRect().left
      const dur = curSceneDur()
      const mv = (ev) => {
        const t = Math.max(0, Math.min((ev.clientX - barL) / pps, dur))
        k.t = Math.round(t * fpsOf()) / fpsOf()
        dot.style.left = (k.t * pps) + 'px'
      }
      const up = () => {
        window.removeEventListener('mousemove', mv)
        window.removeEventListener('mouseup', up)
        kver++
        $emit('docchange')
      }
      window.addEventListener('mousemove', mv)
      window.addEventListener('mouseup', up)
    }

    curSceneDur = () => {
      const sc = doc && doc.scenes[curSceneIdx()]
      return sc ? +sc.duration || 1 : 1
    }

    onRulerDown = (e) => {
      if (!doc) return
      const inner = $refs.inner
      if (!inner) return
      const rect = inner.getBoundingClientRect()
      const seekTo = (clientX) => {
        const x = Math.max(0, Math.min(clientX - rect.left, totalDur() * pps))
        $emit('seek', Math.round((x / pps) * fpsOf()))
      }
      seekTo(e.clientX)
      const mv = (ev) => seekTo(ev.clientX)
      const up = () => {
        window.removeEventListener('mousemove', mv)
        window.removeEventListener('mouseup', up)
      }
      window.addEventListener('mousemove', mv)
      window.addEventListener('mouseup', up)
    }

    fmtS = (s) => {
      const m = Math.floor(s / 60)
      return m + ':' + String(s % 60).padStart(2, '0')
    }
    fmtT = (s) => {
      s = Math.max(0, s || 0)
      const m = Math.floor(s / 60)
      const r = Math.floor(s % 60)
      const d = Math.floor((s % 1) * 10)
      return m + ':' + String(r).padStart(2, '0') + '.' + d
    }
  </script>
  <script>
    // Ctrl+滚轮缩放时间轴（以鼠标位置为锚点）
    const clampN = (v, a, b) => (v < a ? a : v > b ? b : v)
    const scEl = $refs.scroll
    if (scEl) {
      scEl.addEventListener('wheel', (e) => {
        if (!e.ctrlKey || !doc) return
        e.preventDefault()
        const rect = scEl.getBoundingClientRect()
        const t0 = (e.clientX - rect.left + scEl.scrollLeft) / pps
        pps = clampN(pps * (e.deltaY < 0 ? 1.25 : 0.8), 10, 240)
        kver++
        setTimeout(() => { scEl.scrollLeft = t0 * pps - (e.clientX - rect.left) }, 0)
      }, { passive: false })
    }

    // 播放头跟随：超出可视区时自动滚动
    $watch(() => frame, () => {
      if (!scEl) return
      const x = playX()
      const vw = scEl.clientWidth
      if (x > scEl.scrollLeft + vw - 60) scEl.scrollLeft = x - 60
      else if (x < scEl.scrollLeft) scEl.scrollLeft = Math.max(0, x - 60)
    })
  </script>
</html>
