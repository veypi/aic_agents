<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>export diff (real render.js)</title>
<style>
  body { background:#111; color:#ddd; font:13px monospace; margin:0; padding:16px; }
  h3 { margin:14px 0 6px; color:#7dd3fc; }
  canvas { background:#000; border:1px solid #444; }
  .row { display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px; margin-bottom:10px; }
  .cell { display:flex; flex-direction:column; gap:2px; }
  .cell b { color:#fbbf24; font-weight:400; }
  .live { border:1px solid #4ade80; overflow:hidden; position:relative; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
  import { Video } from '../video/engine.js'
  import { drawFrameToCanvas } from '../video/render.js'

  const out = document.getElementById('out')
  const log = (s) => { out.insertAdjacentHTML('beforeend', s) }

  const doc = await (await fetch('../cases/showreel/index.json')).json()
  const v = new Video()
  v.load(doc)
  await v.prepare()
  const W = doc.size.width, H = doc.size.height

  const cell = (label) => {
    const c = Object.assign(document.createElement('div'), { className: 'cell' })
    c.appendChild(Object.assign(document.createElement('b'), { textContent: label }))
    out.lastChild.appendChild(c)
    return c
  }

  // frames: s3 three mid, s5 audio mid
  for (const F of [360, 700]) {
    const node = v.buildFrame(F)
    log('<h3>frame ' + F + ' elements=' + node.querySelectorAll('[data-el-id]').length + '</h3>')
    log('<div class="row"></div>')
    const row = out.lastChild
    const sc = 900 / W
    // LIVE ground truth (scaled DOM)
    const liveWrap = document.createElement('div')
    liveWrap.className = 'live'
    liveWrap.style.cssText = 'width:' + Math.round(W * sc) + 'px;height:' + Math.round(H * sc) + 'px;'
    const liveNode = v.buildFrame(F)
    liveNode.style.transformOrigin = '0 0'
    liveNode.style.transform = 'scale(' + sc + ')'
    liveWrap.appendChild(liveNode)
    const c1 = cell('LIVE')
    c1.appendChild(liveWrap)
    // EXPORT doc size
    const cA = document.createElement('canvas'); cA.width = W; cA.height = H
    await drawFrameToCanvas(node, cA, cA.getContext('2d'), W, H)
    cA.style.width = Math.round(W * sc) + 'px'
    cell('EXPORT ' + W + 'x' + H).appendChild(cA)
    // EXPORT downscaled（重建节点：three 需要同任务内的有效缓冲区）
    const node2 = v.buildFrame(F)
    const cB = document.createElement('canvas'); cB.width = 1280; cB.height = 720
    await drawFrameToCanvas(node2, cB, cB.getContext('2d'), 1280, 720)
    cB.style.width = Math.round(W * sc) + 'px'
    cell('EXPORT 1280x720').appendChild(cB)
  }
  log('<h3>done</h3>')
</script>
</body>
</html>
