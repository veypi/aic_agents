<!DOCTYPE html>
<html>
<head>
<meta name="description" content="ReliaScope 验证报告" />
<title>验证报告 · ReliaScope</title>
</head>
<body>
<app-menu>
    <header class="pagehead">
      <div>
        <div class="crumb">资产与质量 · Reports</div>
        <h1>验证报告</h1>
      </div>
      <div class="right"><button class="btn" @click="openIssue()">＋ 签发报告</button></div>
    </header>

    <template v-if="viewing">
      <div class="srow"><h2>{{ detail.code }} · {{ swName(detail.software_id) }}</h2><div class="ln"></div>
        <span class="pill" :class="ccClass(detail.conclusion)">{{ detail.conclusion }}</span>
        <button class="btn ghost sm" @click="closeDetail()">← 返回列表</button></div>
      <div v-if="!secs.length" class="card" style="text-align:center;padding:44px;color:var(--text-color-disabled);font-size:12.5px;line-height:2">该报告暂无内容块数据（report_sections 为空）</br>由「签发报告」Agent 任务生成图文内容后在此渲染</div>
      <div v-for="s in secs" class="card" style="margin-bottom:15px">
        <h3>{{ s.title }}</h3>
        <div v-if="s.kind === 'text'" style="font-size:13px;line-height:2.1;color:var(--text-color-secondary);white-space:pre-wrap">{{ s.content }}</div>
        <div v-else-if="s.kind === 'metrics' && s.data" class="g g4" style="margin-top:10px">
          <div v-for="m in s.data" class="card kpi" style="box-shadow:none">
            <div class="lb">{{ m.lb }}</div>
            <div class="vl" :style="{color: m.c || '#101c3d'}">{{ m.v }}<span class="un">{{ m.un }}</span></div>
          </div>
        </div>
        <table v-else-if="s.kind === 'table' && s.data">
          <thead><tr><th v-for="c in s.data.cols">{{ c }}</th></tr></thead>
          <tbody><tr v-for="(row, ri) in s.data.rows"><td v-for="(cell, ci) in row">{{ cell }}</td></tr></tbody>
        </table>
        <div v-else-if="s.kind === 'chart' && s.data" :id="'rsec-' + s.id" class="chart" style="height:280px"></div>
        <div v-else-if="s.kind === 'verdict' && s.data" style="text-align:center;padding:8px 0">
          <div style="font-size:20px;font-weight:800;letter-spacing:.14em" :style="{color: s.data.pass ? '#047857' : '#b91c1c'}">{{ s.data.pass ? '验 证 通 过' : '验 证 未 通 过' }}</div>
          <table style="max-width:560px;margin:14px auto 0;text-align:left">
            <tbody><tr v-for="it in (s.data.items || [])"><td>{{ it.name }}><td class="mono">{{ it.actual }}</td><td><span class="pill" :class="it.ok ? 'p-green' : 'p-red'">{{ it.ok ? '满足' : '不满足' }}</span></td></tr></tbody>
          </table>
          <div style="margin-top:12px;font-size:12.5px;color:var(--text-color-secondary)">{{ s.data.advice }}</div>
        </div>
      </div>
    </template>
    <template v-else>
    <div class="g g3">
      <div class="card">
        <h3>验证结论总览</h3>
        <div class="desc">本季度 {{ reps.length }} 个验证任务</div>
        <div id="ch-concl" class="chart" style="height:250px"></div>
      </div>
      <div class="card" style="grid-column:span 2">
        <h3>报告列表 <span class="tag">reports 表</span></h3>
        <table>
          <thead><tr><th>报告编号</th><th>对象软件</th><th>验证类型</th><th>结论</th><th>签发日期</th><th>进度</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in reps">
              <td class="mono">{{ r.code }}</td>
              <td><b>{{ swName(r.software_id) }}</b></td>
              <td>{{ r.vtype }}</td>
              <td><span class="pill" :class="ccClass(r.conclusion)">{{ r.conclusion }}</span></td>
              <td class="mono" style="color:var(--text-color-tertiary)">{{ r.issue_date }}</td>
              <td style="min-width:110px">
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="bar" style="flex:1"><i :style="{width: r.progress + '%', background: r.progress >= 100 ? '#059669' : '#4361ee'}"></i></div>
                  <span class="mono" style="font-size:11px">{{ r.progress }}%</span>
                </div>
              </td>
              <td style="white-space:nowrap"><a class="tlink" @click="openDetail(r)">查看报告</a><a class="tlink" style="margin-left:9px" @click="goTarget(r.software_id)">对象</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:15px">
      <h3>指标达成度甘特</h3>
      <div class="desc">各验证任务里程碑与可靠性指标达成进度</div>
      <div id="ch-gantt" class="chart" style="height:300px"></div>
    </div>
    </template>

    <div class="mask" v-if="showIssue" @click="showIssue = false">
      <div class="modal" @click.stop="noop()">
        <h3>签发验证报告</h3>
        <div class="desc" style="margin:-8px 0 14px">由 Agent 后台任务计算指标、核对判据，并把图文报告数据写入 reports / report_sections 表</div>
        <div class="fld"><label>对象软件</label>
          <select class="fin" v:value="issue.sid">
            <option v-for="s in softs" :value="s.id">{{ s.name }}</option>
          </select></div>
        <div class="fld"><label>验证类型</label>
          <select class="fin" v:value="issue.vtype">
            <option>可靠性鉴定试验</option><option>可靠性增长试验</option><option>验收测试</option>
          </select></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
          <button class="btn ghost" @click="showIssue = false">取消</button>
          <button class="btn" :disabled="issuing" @click="doIssue()">{{ issuing ? 'Agent 生成中…' : '生成报告（Agent）' }}</button>
        </div>
      </div>
    </div>
    <div class="footer-note">报告签发后自动进入结论总览与甘特图</div>
</app-menu>
</body>
<script setup>
reps = []
softs = []
showIssue = false
issuing = false
viewing = false
detail = null
secs = []
issue = { sid: '', vtype: '可靠性鉴定试验' }
noop = () => {}

const swm = {}
const charts = {}
const mk = (id, opt) => {
  const el = document.getElementById(id)
  if (!el) return
  if (charts[id]) charts[id].dispose()
  const c = echarts.init(el)
  c.setOption(opt)
  charts[id] = c
}
const TIP = { trigger: 'item', backgroundColor: '#0f172a', borderColor: '#1e293b', textStyle: { color: '#e2e8f0', fontSize: 12 } }
const AX = { axisLine: { lineStyle: { color: '#d3dae6' } }, axisLabel: { color: '#6b7280', fontSize: 11 }, splitLine: { lineStyle: { color: '#eaeff7' } } }

swName = (id) => swm[id] || id
ccClass = (c) => c === '通过' ? 'p-green' : c === '有条件通过' ? 'p-yellow' : c === '不通过' ? 'p-red' : 'p-gray'
goTarget = (id) => {
  const to = '/i/target?software_id=' + id
  $router.push(to)
}
openIssue = () => {
  issue = { sid: (softs[0] || {}).id || '', vtype: '可靠性鉴定试验' }
  showIssue = true
}

/* ---------- Agent 任务执行器 ---------- */
const runTask = async (payload) => {
  const r = await $fetch('/api/tasks', { method: 'POST', body: payload })
  const id = r.task && r.task.id
  if (!id) throw new Error('任务创建失败')
  const t0 = Date.now()
  while (Date.now() - t0 < 300000) {
    await new Promise(r2 => setTimeout(r2, 3000))
    const t = await $fetch('/api/tasks/' + id)
    if (t.status === 'completed') return t
    if (t.status === 'failed' || t.status === 'canceled') throw new Error(t.error || '任务执行失败')
  }
  throw new Error('任务执行超时，可稍后在任务中心查看结果')
}

doIssue = async () => {
  if (issuing) return
  issuing = true
  try {
    await runTask({
      title: '生成可靠性验证报告 · ' + swName(issue.sid),
      goal: '为软件「' + swName(issue.sid) + '」(id:' + issue.sid + ') 生成' + issue.vtype + '报告数据：读取其 failures 样本与 criteria 判据，计算 λ/MTBF/R(720h)/置信区间并逐条核对启用判据得出结论；写 reports 主行（code=RPT-YYYYMMDD-两位序号、vtype、conclusion、issue_date=今日、progress=100），并把报告内容块按 sort 顺序写入 report_sections 表：sort=1 text「试验概况」、sort=2 metrics「核心指标」、sort=3 chart(pie)「故障模式分布」、sort=4 chart(line)「累计失效趋势」、sort=5 table「判据逐条核对」、sort=6 verdict「结论与建议」。',
      steps: '1. table.list failures(filters software_id) 与 criteria → 2. 按 index.md 口径计算指标并判定 → 3. table.add reports → 4. 依次 table.add report_sections 六个内容块 → 5. 返回报告编号与结论',
      constraints: 'kind 仅限 text/metrics/table/chart/verdict；payload 必须是合法 JSON 字符串；metrics 项形如 {"lb","v","un","c"}；table 形如 {"cols":[],"rows":[[]]}；chart 形如 {"type":"pie|line","x":[],"series":[]}；verdict 形如 {"pass":bool,"items":[{"name","actual","ok"}],"advice"}；不得修改 failures',
      schedule_type: 'once'
    })
    showIssue = false
    $message.success('报告已生成并入库，点击「查看报告」阅读')
    await load()
  } catch (e) { $message.error('报告任务：' + e.message) }
  issuing = false
}

openDetail = async (r) => {
  detail = r
  viewing = true
  secs = []
  try {
    const rs = await $fetch('/tables/report_sections', { params: { size: 100, filters: JSON.stringify({ report_id: r.id }), sort: 'sort' } })
    secs = (rs.items || []).map(s => {
      let d = null
      if (s.payload) { try { d = JSON.parse(s.payload) } catch (e) { d = null } }
      return { ...s, data: d }
    })
    setTimeout(drawSec, 80)
  } catch (e) { $message.error('报告内容加载失败：' + e.message) }
}
closeDetail = () => { viewing = false; detail = null; secs = [] }

const drawSec = () => {
  const GRID = { left: 48, right: 22, top: 30, bottom: 28 }
  secs.filter(s => s.kind === 'chart' && s.data).forEach(s => {
    const el = document.getElementById('rsec-' + s.id)
    if (!el) return
    const c = echarts.init(el)
    const d = s.data
    if (d.type === 'pie') {
      c.setOption({ tooltip: { trigger: 'item', backgroundColor: '#0f172a', textStyle: { color: '#e2e8f0' } },
        series: [{ type: 'pie', radius: ['40%', '68%'], padAngle: 2, itemStyle: { borderRadius: 5, borderColor: '#fff', borderWidth: 2 },
          label: { color: '#6b7280', fontSize: 11 }, data: d.series || [] }] })
    } else {
      c.setOption({ tooltip: TIP, grid: GRID,
        xAxis: { type: 'category', data: d.x || [], ...AX },
        yAxis: { type: 'value', ...AX },
        series: (d.series || []).map(sr => ({ type: d.type === 'bar' ? 'bar' : 'line', name: sr.name, data: sr.data, smooth: true, lineStyle: { width: 2 }, areaStyle: d.type === 'bar' ? undefined : { color: 'rgba(67,97,238,.08)' } })) })
    }
  })
}

const draw = () => {
  const cc = { '通过': 0, '有条件通过': 0, '不通过': 0, '待完成': 0 }
  reps.forEach(r => { cc[r.conclusion] = (cc[r.conclusion] || 0) + 1 })
  mk('ch-concl', { tooltip: TIP,
    series: [{ type: 'pie', radius: ['45%', '75%'], padAngle: 2,
      itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
      label: { color: '#6b7280', fontSize: 11, formatter: '{b} {c}' },
      data: [
        { value: cc['通过'], name: '通过', itemStyle: { color: '#059669' } },
        { value: cc['有条件通过'], name: '有条件通过', itemStyle: { color: '#d97706' } },
        { value: cc['不通过'], name: '不通过', itemStyle: { color: '#dc2626' } },
        { value: cc['待完成'], name: '待完成', itemStyle: { color: '#94a3b8' } }
      ].filter(d => d.value > 0) }] })
  const names = reps.map(r => (swm[r.software_id] || r.software_id).slice(0, 9))
  mk('ch-gantt', { tooltip: { formatter: (p) => p.name + '<br>' + p.value + '%' },
    grid: { left: 130, right: 48, top: 16, bottom: 26 }, animationDuration: 900,
    xAxis: { type: 'value', max: 100, ...AX, axisLabel: { ...AX.axisLabel, formatter: '{value}%' } },
    yAxis: { type: 'category', data: names, ...AX },
    series: [{ type: 'bar', barWidth: 14,
      data: reps.map((r, i) => ({ value: Number(r.progress || 0), name: names[i],
        itemStyle: { borderRadius: 7, color: Number(r.progress) >= 100 ? '#059669'
          : r.conclusion === '不通过' ? '#dc2626'
          : { type: 'linear', x: 0, y: 0, x2: 1, y2: 0, colorStops: [{ offset: 0, color: '#4361ee' }, { offset: 1, color: '#0891b2' }] } } })),
      label: { show: true, position: 'right', color: '#6b7280', formatter: '{c}%' },
      showBackground: true, backgroundStyle: { color: 'rgba(67,97,238,.06)', borderRadius: 7 } }] })
}

window.addEventListener('resize', () => Object.values(charts).forEach(c => c && c.resize && c.resize()))

load = async () => {
  try {
    const [rp, sw] = await Promise.all([
      $fetch('/tables/reports', { params: { size: 200 } }),
      $fetch('/tables/softwares', { params: { size: 200 } })
    ])
    reps = (rp.items || []).sort((a, b) => String(b.issue_date).localeCompare(String(a.issue_date)))
    softs = sw.items || []
    softs.forEach(s => { swm[s.id] = s.name })
    setTimeout(draw, 60)
  } catch (e) {
    $message.error('数据加载失败：' + e.message)
  }
}
</script>
<script>
load()
</script>
</html>
